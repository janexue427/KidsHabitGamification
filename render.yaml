# Render blueprint for the QuestFam API.
# Deploy: Render dashboard → New → Blueprint → point at this repo.
#
# The client is hosted separately on GitHub Pages (see
# .github/workflows/deploy-pages.yml); only the API runs here.
services:
  - type: web
    name: questfam-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.4.0
      - key: NODE_ENV
        value: production
      # Generated once by Render and kept private; the server refuses to boot
      # on the dev default, so this must be present.
      - key: JWT_SECRET
        generateValue: true
      # Which browser origin may call this API. Update if the Pages URL changes.
      - key: CORS_ORIGIN
        value: https://janexue427.github.io
      # Storage lives in Turso, not on this host: the free plan wipes its disk on
      # every deploy and idle restart. Both values are set in the Render dashboard
      # rather than here, so the token stays out of the repository.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Google sign-in. Public value, but set in the dashboard so it can be
      # changed without a commit. Unset simply disables the Google button.
      - key: GOOGLE_CLIENT_ID
        sync: false
